<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eee4">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!--META-->
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Karla:wght@400;500&display=swap">
<link rel="stylesheet" href="css/letter.css">
</head>
<body>

<!-- the room: wall, table, and the wrapped bouquet -->
<div id="stage" class="stage"></div>

<!-- words above the bouquet -->
<div id="hello" class="hello" aria-live="polite">
  <div class="hello-to" id="helloTo"></div>
  <div class="hello-from" id="helloFrom"></div>
</div>

<!-- opening screen: their name in the empty room. The tap also lets the music start. -->
<button id="gate" class="gate" type="button" hidden aria-label="Open your letter">
  <span class="gate-name" id="gateName">for you</span>
  <span class="gate-hint">tap to open</span>
</button>

<!-- the link could not be read -->
<section id="broken" class="panel" hidden>
  <div class="panel-in">
    <h1 class="panel-title" id="brokenTitle">This letter lost its way.</h1>
    <p class="panel-note" id="brokenNote">The link may be incomplete. Ask whoever sent it to copy it again.</p>
  </div>
</section>

<!-- the envelope that rests on the table beside the bouquet once the flowers have opened -->
<button id="envelope" class="envelope" type="button" hidden aria-label="Open your letter">
  <span class="env-body">
    <span class="env-back"></span>
    <span class="env-sheet"></span>
    <span class="env-front"></span>
    <span class="env-flap"></span>
    <span class="env-seal"></span>
  </span>
</button>
<button id="envLabel" class="env-label" type="button" hidden tabindex="-1" aria-hidden="true">tap to open your letter</button>

<!-- the opening: the same envelope lifted off the table, large, in the middle of the screen.
     Its seal breaks, the flap opens, and the letter slides out and unfolds into the page. -->
<div id="opener" class="opener" hidden aria-hidden="true">
  <span class="op-back"></span>
  <span class="op-sheet" id="opSheet"></span>
  <span class="op-front"></span>
  <span class="op-flap"></span>
  <span class="op-seal"></span>
</div>

<!-- the letter -->
<div id="sheet" class="sheet" hidden>
  <article class="paper" id="paper" tabindex="-1">
    <img class="sprig" id="sprig" alt="" aria-hidden="true">
    <h1 class="p-to" id="pTo"></h1>
    <div class="p-body" id="pBody"></div>
    <p class="p-from" id="pFrom"></p>

    <div class="voice" id="voice" hidden>
      <button type="button" class="voice-btn" id="voiceBtn" aria-label="Play the voice note">
        <svg class="ic-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8.5 6.5 16.5 12l-8 5.5z" fill="currentColor"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7.5" y="6.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="13.3" y="6.5" width="3.2" height="11" rx="1" fill="currentColor"/></svg>
      </button>
      <div class="voice-meta">
        <span class="voice-label">a voice note for you</span>
        <span class="voice-track" id="voiceTrack"><span class="voice-fill" id="voiceFill"></span></span>
      </div>
      <span class="voice-time" id="voiceTime">0:00</span>
      <audio id="voiceAudio" preload="metadata"></audio>
    </div>

    <div class="photos" id="photos" hidden></div>
  </article>

  <div class="actions" id="actions">
    <button type="button" id="backBtn">Back to the flowers</button>
    <button type="button" id="saveBtn">Save as image</button>
  </div>
  <p class="made">Tenderly · letters that bloom</p>
</div>

<button id="snd" class="snd" type="button" data-state="blocked" aria-label="Turn sound on" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>
    <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.6 7.6 0 0 1 0 11"/>
    <path class="slash" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
  </svg>
  <span class="label">tap for sound</span>
</button>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Photo"><img id="lightboxImg" alt=""><p id="lightboxCap"></p></div>

<audio id="bgm" preload="none"></audio>

<script src="js/codec.js"></script>
<script src="js/kit.js"></script>
<script src="js/peony.js"></script>
<script src="js/lily.js"></script>
<script src="js/bouquet.js"></script>
<script src="js/world-lilies.js"></script>
<script src="js/world-peonies.js"></script>
<script src="js/world-mixed.js"></script>
<script src="js/scene.js"></script>
<script src="js/letter.js"></script>
</body>
</html>
