<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · Tenderly</title>
<style>
  :root { --bg: #f6eee4; --ink: #4b2f3b; --muted: rgba(75,47,59,.64); --accent: #b5476b; color-scheme: light; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 80% at 10% 0%, #fffaf0, var(--bg) 70%); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px 16px; }
  h1 { margin: 0; font: italic 400 36px/1.1 Georgia, "Times New Roman", serif; }
  p { margin: 0; color: var(--muted); max-width: 34ch; }
  a { justify-self: center; margin-top: 8px; color: #fff; background: var(--accent); text-decoration: none; font-weight: 500; padding: 12px 22px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1>This letter lost its way.</h1>
  <p>The link may be incomplete. Ask whoever sent it to copy it again.</p>
  <a href="/">Write a letter</a>
</main>
</body>
</html>
