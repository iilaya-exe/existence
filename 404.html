<title>Not found · Tenderly</title>
<style>
  :root { --bg: #07060a; --ink: #efe7da; --muted: rgba(239,231,218,.62); --gold: #e8c98a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px 16px; }
  h1 { margin: 0; font: italic 500 34px/1.1 Georgia, "Times New Roman", serif; }
  p { margin: 0; color: var(--muted); max-width: 34ch; }
  a { justify-self: center; margin-top: 8px; color: #1a1014; background: var(--gold); text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1>This letter lost its way.</h1>
